<section class="categories-page">
  <div class="page-header">
    <div>
      <span class="section-kicker">SAVORÉ CATEGORIES</span>
      <h1>Browse recipes</h1>
    </div>
    <a class="icon-button" routerLink="/discover">Discover recipes</a>
  </div>

  <section class="categories-shell">
    <section class="classification-section">
      <div class="classification-heading">
        <span class="section-kicker">Cuisines</span>
        <h2>Explore by cuisine</h2>
        <p>Every recipe in the collection is tagged with one of these cuisines.</p>
      </div>

      <div class="category-grid">
        <div class="category-card" *ngFor="let cuisine of cuisines">
          <button class="category-main" type="button" (click)="browseCuisine(cuisine)">
            <span class="category-icon">✦</span>
            <span class="category-name">{{ cuisine }}</span>
            <span class="category-arrow">→</span>
          </button>
        </div>
      </div>
    </section>

    <section class="classification-section">
      <div class="classification-heading">
        <span class="section-kicker">Meal categories</span>
        <h2>Explore by meal category</h2>
        <p>Filter recipes by the meal they fit best.</p>
      </div>

      <div class="category-grid">
        <div class="category-card" *ngFor="let mealCategory of mealCategories">
          <button class="category-main" type="button" (click)="browseMealCategory(mealCategory)">
            <span class="category-icon">✦</span>
            <span class="category-name">{{ mealCategory }}</span>
            <span class="category-arrow">→</span>
          </button>
        </div>
      </div>
    </section>
  </section>
</section>
